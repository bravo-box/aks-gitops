apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - webapp-deployment.yaml
  - webapp-service.yaml

images:
  - name: webapp
    newName: betanet.azurecr.us/webapp # replace with your registry/image
    newTag: "b87cd00" # git short SHA — bump this on every image push so Flux detects a manifest diff
