apiVersion: v1
kind: Secret
metadata:
  namespace: sql-server
  name: acr-pull-secret
type: kubernetes.io/dockerconfigjson
stringData:
  # Placeholder only — do NOT commit real credentials here. Generate and apply directly instead:
  #   kubectl create secret docker-registry acr-pull-secret \
  #     --namespace sql-server \
  #     --docker-server=<acr_name>.azurecr.us \
  #     --docker-username=<ACR_USERNAME> \
  #     --docker-password=<ACR_PASSWORD_OR_TOKEN> \
  #     --dry-run=client -o yaml | kubectl apply -f -
  .dockerconfigjson: '{"auths":{"<acr_name>.azurecr.us":{"username":"<ACR_USERNAME>","password":"<ACR_PASSWORD_OR_TOKEN>","auth":"<base64 of USERNAME:PASSWORD>"}}}'
